<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dusk &amp; Dawn Routines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --top:#3a2f7a; --bot:#7a5fa8;
  --ink:#eef0ff; --soft:#b9bde6; --glass:rgba(12,12,48,.42); --line:rgba(185,189,230,.22);
  --moon:#f3e9cf;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--sans);color:var(--ink);line-height:1.5;
  background:linear-gradient(180deg,var(--top),var(--bot)) fixed;
  padding:max(20px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom));
}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--serif);font-weight:300;font-size:1.5rem;margin:0;text-align:center;letter-spacing:.01em}
.tabs{display:flex;background:var(--glass);border-radius:999px;padding:4px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--soft);font:600 1rem var(--sans);padding:11px 0;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#1d1b52}
button:focus-visible,input:focus-visible{outline:3px solid var(--moon);outline-offset:2px}

.clock{position:relative;width:min(84vw,340px);aspect-ratio:1;margin:4px auto 0}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:none;stroke:rgba(255,255,255,.14);stroke-width:6}
.bar{fill:none;stroke:var(--moon);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time{font-family:var(--serif);font-weight:300;font-size:clamp(2.8rem,13vw,4.2rem);line-height:1;font-variant-numeric:tabular-nums}
.status{color:var(--soft);margin-top:8px;font-size:.95rem}

.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.btn{font:600 1rem var(--sans);border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:12px 20px;cursor:pointer;min-height:48px}
.btn.main{background:var(--moon);color:#2a2260;border-color:var(--moon);min-width:130px;font-size:1.1rem}
.btn[disabled]{opacity:.4;cursor:default}
.dur{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--soft);font-size:.95rem}
.dur .btn{padding:6px 14px;min-height:40px}

.panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px}
.panel h2{font-family:var(--serif);font-weight:500;font-size:1.15rem;margin:0 0 10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li label{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer;padding:6px 0;min-height:44px}
li input[type=checkbox]{appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--soft);flex:none;display:grid;place-content:center;margin:0;cursor:pointer}
li input[type=checkbox]:checked{background:var(--moon);border-color:var(--moon)}
li input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #2a2260;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
li.done span{color:var(--soft);text-decoration:line-through}
.x{background:none;border:0;color:var(--soft);font-size:1.4rem;cursor:pointer;width:40px;height:40px;border-radius:50%}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;font:inherit;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:11px 16px}
.add input::placeholder{color:var(--soft)}
.count{color:var(--soft);font-size:.9rem;margin:10px 2px 0}

.breathe{text-align:center}
.orb-wrap{height:190px;display:flex;align-items:center;justify-content:center}
.orb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7df,var(--moon) 45%,#b9a8e8);box-shadow:0 0 50px rgba(243,233,207,.35)}
.breathe.on .orb{animation:breathe 14s ease-in-out infinite}
@keyframes breathe{
  0%{transform:scale(1)} 28.5%{transform:scale(1.7)} 57%{transform:scale(1.7)} 100%{transform:scale(1)}
}
.cue{min-height:1.6em;font-family:var(--serif);font-size:1.25rem;margin:0 0 12px}
@media (prefers-reduced-motion:reduce){.breathe.on .orb{animation:none}.bar{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Dusk &amp; Dawn</h1>

  <div class="tabs" role="tablist" aria-label="Routine">
    <button role="tab" id="tab-morning" aria-selected="false" data-mode="morning">Morning</button>
    <button role="tab" id="tab-bed" aria-selected="false" data-mode="bed">Bedtime</button>
  </div>

  <section aria-label="Timer">
    <div class="clock">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="94"/>
        <circle class="bar" id="bar" cx="100" cy="100" r="94"/>
      </svg>
      <div class="readout">
        <div class="time" id="time" role="timer" aria-live="off">1:30:00</div>
        <div class="status" id="status">Ready when you are</div>
      </div>
    </div>
    <div class="controls" style="margin-top:20px">
      <button class="btn" id="reset">Reset</button>
      <button class="btn main" id="go">Start</button>
    </div>
    <div class="dur" style="margin-top:14px">
      <button class="btn" id="minus" aria-label="Shorten by 5 minutes">−5</button>
      <span id="durLabel">1 hr 30 min routine</span>
      <button class="btn" id="plus" aria-label="Lengthen by 5 minutes">+5</button>
    </div>
  </section>

  <section class="panel" aria-labelledby="listTitle">
    <h2 id="listTitle">Morning checklist</h2>
    <ul id="list"></ul>
    <div class="add">
      <input id="newItem" type="text" placeholder="Add a step" aria-label="Add a step" maxlength="80">
      <button class="btn" id="addBtn">Add</button>
    </div>
    <p class="count" id="count"></p>
  </section>

  <section class="panel breathe" id="breathe" aria-labelledby="bTitle">
    <h2 id="bTitle">Breathing circle</h2>
    <div class="orb-wrap"><div class="orb"></div></div>
    <p class="cue" id="cue" aria-live="polite">Breathe in for 4, hold for 4, out for 6</p>
    <button class="btn" id="bBtn">Start breathing</button>
  </section>
</main>

<script>
(function(){
  var KEY="duskdawn.v2";
  var today=function(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
  var defaults={
    mode:null,
    dur:{morning:90,bed:90},
    items:{
      morning:[
        {t:"5 sips of water",c:false},
        {t:"Gym / Movement",c:false},
        {t:"Breakfast",c:false},
        {t:"Brush teeth",c:false},
        {t:"Shower",c:false},
        {t:"Skincare",c:false},
        {t:"Tidy room",c:false},
        {t:"Hair",c:false}
      ],
      bed:[
        {t:"Tidy room",c:false},
        {t:"Dishes / Living room",c:false},
        {t:"Pick out clothes for tomorrow",c:false},
        {t:"Prepare breakfast and lunch",c:false},
        {t:"Fill water bottle",c:false},
        {t:"Check tomorrow’s schedule",c:false},
        {t:"Brush teeth",c:false},
        {t:"Skincare",c:false},
        {t:"Put phone on charger away from bed",c:false},
        {t:"Crochet, read, journal, or relax",c:false}
      ]
    },
    day:today()
  };
  var S;
  try{S=JSON.parse(localStorage.getItem(KEY))||defaults;}catch(e){S=defaults;}
  if(!S.dur||!S.items)S=defaults;
  if(S.day!==today()){["morning","bed"].forEach(function(m){S.items[m].forEach(function(i){i.c=false;});});S.day=today();}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

  // Gradient endpoints [top,bottom] at start and end of each routine
  var SKY={
    morning:{from:[[26,27,75],[59,58,122]],to:[[90,107,184],[125,106,174]]},
    bed:{from:[[58,47,122],[122,95,168]],to:[[9,10,34],[20,21,58]]}
  };
  var NAMES={morning:"Morning",bed:"Bedtime"};

  var rt={
    morning:{left:S.dur.morning*60,end:null,total:S.dur.morning*60},
    bed:{left:S.dur.bed*60,end:null,total:S.dur.bed*60}
  };
  var hr=new Date().getHours();
  var mode=S.mode||((hr>=17||hr<4)?"bed":"morning");

  var $=function(id){return document.getElementById(id);};
  var bar=$("bar"),C=2*Math.PI*94;
  bar.style.strokeDasharray=C;

  function fmt(s){s=Math.max(0,Math.ceil(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,p=function(n){return String(n).padStart(2,"0");};return h?h+":"+p(m)+":"+p(r):p(m)+":"+p(r);}
  function lbl(m){var h=Math.floor(m/60),r=m%60;return (h?h+" hr":"")+(h&&r?" ":"")+(r?r+" min":"");}
  function mix(a,b,p){return a.map(function(v,i){return Math.round(v+(b[i]-v)*p);});}
  function rgb(c){return "rgb("+c.join(",")+")";}

  function paintSky(p){
    var s=SKY[mode];
    document.documentElement.style.setProperty("--top",rgb(mix(s.from[0],s.to[0],p)));
    document.documentElement.style.setProperty("--bot",rgb(mix(s.from[1],s.to[1],p)));
  }

  function render(){
    var t=rt[mode],running=t.end!==null,p=1-t.left/t.total;
    $("time").textContent=fmt(t.left);
    bar.style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,t.left/t.total)));
    paintSky(Math.max(0,Math.min(1,p)));
    $("go").textContent=running?"Pause":(t.left<=0?"Again":(t.left<t.total?"Resume":"Start"));
    $("status").textContent=t.left<=0?(mode==="bed"?"Rest well":"You’re ready for the day"):running?(mode==="bed"?"Winding down":"Easing into the day"):(t.left<t.total?"Paused":"Ready when you are");
    $("minus").disabled=$("plus").disabled=running||t.left<t.total;
    $("durLabel").textContent=lbl(S.dur[mode])+" routine";
    document.title=running?fmt(t.left)+" · "+NAMES[mode]:"Dusk & Dawn Routines";
  }

  var wake=null;
  function lock(on){
    try{
      if(on&&"wakeLock" in navigator){navigator.wakeLock.request("screen").then(function(w){wake=w;}).catch(function(){});}
      else if(!on&&wake){wake.release();wake=null;}
    }catch(e){}
  }

  function chime(){
    try{
      var A=new (window.AudioContext||window.webkitAudioContext)();
      [523.25,659.25,783.99].forEach(function(f,i){
        var o=A.createOscillator(),g=A.createGain(),t0=A.currentTime+i*0.7;
        o.type="sine";o.frequency.value=f;
        g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.18,t0+.05);g.gain.exponentialRampToValueAtTime(.001,t0+2.4);
        o.connect(g);g.connect(A.destination);o.start(t0);o.stop(t0+2.5);
      });
    }catch(e){}
  }

  function tick(){
    var now=Date.now(),anyRunning=false;
    ["morning","bed"].forEach(function(m){
      var t=rt[m];
      if(t.end===null)return;
      t.left=(t.end-now)/1000;
      if(t.left<=0){t.left=0;t.end=null;chime();}
      else anyRunning=true;
    });
    if(!anyRunning)lock(false);
    render();
  }
  setInterval(tick,250);

  $("go").onclick=function(){
    var t=rt[mode];
    if(t.end!==null){t.left=(t.end-Date.now())/1000;t.end=null;lock(false);}
    else{
      if(t.left<=0)t.left=t.total;
      t.end=Date.now()+t.left*1000;lock(true);
    }
    render();
  };
  $("reset").onclick=function(){var t=rt[mode];t.end=null;t.left=t.total;lock(false);render();};

  function adjust(d){
    var m=Math.max(5,Math.min(180,S.dur[mode]+d));
    S.dur[mode]=m;rt[mode].total=rt[mode].left=m*60;save();render();
  }
  $("minus").onclick=function(){adjust(-5);};
  $("plus").onclick=function(){adjust(5);};

  // Checklist
  function renderList(){
    var ul=$("list");ul.textContent="";
    var items=S.items[mode];
    items.forEach(function(it,i){
      var li=document.createElement("li");if(it.c)li.className="done";
      var lab=document.createElement("label");
      var cb=document.createElement("input");cb.type="checkbox";cb.checked=it.c;cb.dataset.i=i;
      var sp=document.createElement("span");sp.textContent=it.t;
      lab.appendChild(cb);lab.appendChild(sp);
      var x=document.createElement("button");x.className="x";x.dataset.del=i;x.textContent="×";x.setAttribute("aria-label","Remove "+it.t);
      li.appendChild(lab);li.appendChild(x);ul.appendChild(li);
    });
    var n=items.filter(function(i){return i.c;}).length;
    $("count").textContent=items.length?(n===items.length?"All done. Nicely handled.":n+" of "+items.length+" done"):"Add your first step above.";
    $("listTitle").textContent=NAMES[mode]+" checklist";
  }
  $("list").addEventListener("change",function(e){
    if(e.target.type==="checkbox"){S.items[mode][+e.target.dataset.i].c=e.target.checked;save();renderList();}
  });
  $("list").addEventListener("click",function(e){
    if(e.target.dataset.del!==undefined){S.items[mode].splice(+e.target.dataset.del,1);save();renderList();}
  });
  function addItem(){
    var v=$("newItem").value.trim();if(!v)return;
    S.items[mode].push({t:v,c:false});$("newItem").value="";save();renderList();
  }
  $("addBtn").onclick=addItem;
  $("newItem").addEventListener("keydown",function(e){if(e.key==="Enter")addItem();});

  // Tabs
  function setMode(m){
    mode=m;S.mode=m;save();
    document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.mode===m);});
    renderList();render();
  }
  document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){setMode(b.dataset.mode);};});

  // Breathing guide: in 4, hold 4, out 6
  var bt=null,b0=0;
  $("bBtn").onclick=function(){
    var box=$("breathe");
    if(bt){clearInterval(bt);bt=null;box.classList.remove("on");$("bBtn").textContent="Start breathing";$("cue").textContent="Breathe in for 4, hold for 4, out for 6";return;}
    box.classList.add("on");$("bBtn").textContent="Stop";b0=Date.now();
    bt=setInterval(function(){
      var s=((Date.now()-b0)/1000)%14;
      $("cue").textContent=s<4?"Breathe in":s<8?"Hold":"Breathe out";
    },100);
  };

  setMode(mode);
})();
</script>
</body>
</html>
